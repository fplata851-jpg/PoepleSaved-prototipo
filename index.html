<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Saved | Inicio de sesión</title>
    <link rel="stylesheet" href="INIsesion.css">
      <link rel="icon" href="Peoplesaved.png">
 <body>
    <header>
    <h2 class="logo">People Saved</h2>
    <nav class="navegacion">
        <button class="Btn">Iniciar Sesión</button>
    </nav>
    </header>

    <div class="wrapper">
        <div class="span icon-close"><ion-icon name="close"></ion-icon></div>
        <div class="form-box login">
    <h2>iniciar sesión</h2>
    <form action="#">
        <div class="input-box">
            <span class="icon"><ion-icon name="mail"></ion-icon></span>
            <input type="email" required>
            <label>Email</label>
        </div>
         <div class="input-box">
            <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
            <input type="password" required>
            <label>Contraseña</label>
        </div> 
        <div class="recordarme">
            <label><input type="checkbox"> Recordarme</label>
           <a href="#">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="Btn">Iniciar Sesión</button>
       <div class="registrate">
       <p>No tienes una cuenta? <a href="#" class="registrate-link">Regístrate aquí</a></p>
   </div>
 </form>
 </div>

  <div class="form-box registrate">
    <h2>Regístrate</h2>
    <form action="#">
        <div class="input-box">
            <span class="icon"><ion-icon name="person"></ion-icon></span>
            <input type="text" required>
            <label>Usuario</label>
        </div>
        
        <div class="input-box">
            <span class="icon"><ion-icon name="mail"></ion-icon></span>
            <input type="email" required>
            <label>Email</label>
        </div>
         <div class="input-box">
            <span class="icon"><ion-icon name="lock-closed"></ion-icon></span>
            <input type="password" required>
            <label>Contraseña</label>
        </div> 
        <div class="recordarme">
            <label><input type="checkbox"> acepto los términos y condiciones </label>
        </div>
        <button type="submit" class="Btn">Registrarse</button>
       <div class="registrate">
       <p>Ya tienes una cuenta? <a href="#" class="iniciasesion-link">Inicia sesión aquí</a></p>
   </div>
 </form>
 </div>
 </div>
    <script src="script.js"></script>
    <script src="Calen.js"></script>
   <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
